<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#451a03"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#f59e0b">03 / LỘ TRÌNH RA MẮT</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Tiến Trình 3 Giai Đoạn (Launch Timeline)</text>
  
  <!-- Horizontal Timeline -->
  <line x1="120" y1="210" x2="840" y2="210" stroke="#b45309" stroke-width="4"/>
  
  <!-- Phase 1 -->
  <circle cx="200" cy="210" r="18" fill="#f59e0b"/>
  <text x="200" y="215" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">1</text>
  <rect x="90" y="245" width="220" height="195" rx="12" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="110" y="275" font-size="13" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 1: BETA</text>
  <text x="110" y="298" font-size="11" font-family="sans-serif" fill="#fde68a">• Tháng 09/2026</text>
  <text x="110" y="322" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="110" dy="0">• Mời 100 Founders thử</tspan>
    <tspan x="110" dy="16">nghiệm sớm (Private).</tspan>
  </text>
  <text x="110" y="365" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="110" dy="0">• Tinh chỉnh tính năng</tspan>
    <tspan x="110" dy="16">Clone &amp; tải tệp PPTX.</tspan>
  </text>
  
  <!-- Phase 2 -->
  <circle cx="480" cy="210" r="18" fill="#f59e0b"/>
  <text x="480" y="215" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">2</text>
  <rect x="370" y="245" width="220" height="195" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="275" font-size="13" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 2: LAUNCH</text>
  <text x="390" y="298" font-size="11" font-family="sans-serif" fill="#fde68a">• Tháng 11/2026</text>
  <text x="390" y="322" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="390" dy="0">• Ra mắt trên Product</tspan>
    <tspan x="390" dy="16">Hunt &amp; Mạng xã hội.</tspan>
  </text>
  <text x="390" y="365" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="390" dy="0">• Kích hoạt gói Pro &amp;</tspan>
    <tspan x="390" dy="16">thanh toán tự động.</tspan>
  </text>
  
  <!-- Phase 3 -->
  <circle cx="760" cy="210" r="18" fill="#f59e0b"/>
  <text x="760" y="215" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">3</text>
  <rect x="650" y="245" width="220" height="195" rx="12" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="670" y="275" font-size="13" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 3: SCALE</text>
  <text x="670" y="298" font-size="11" font-family="sans-serif" fill="#fde68a">• Quý 1/2027</text>
  <text x="670" y="322" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="670" dy="0">• Mở rộng thị trường</tspan>
    <tspan x="670" dy="16">Singapore &amp; Indo.</tspan>
  </text>
  <text x="670" y="365" font-size="11" font-family="sans-serif" fill="#fef3c7">
    <tspan x="670" dy="0">• Bổ sung tính năng</tspan>
    <tspan x="670" dy="16">cộng tác nhóm lớn.</tspan>
  </text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#d97706" text-anchor="end">Slide 4 / 5</text>
</svg>
