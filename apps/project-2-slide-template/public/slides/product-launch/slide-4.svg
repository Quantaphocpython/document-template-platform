<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#451a03"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#f59e0b">03 / LỘ TRÌNH RA MẮT</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Tiến Trình 3 Giai Đoạn (Launch Timeline)</text>
  
  <!-- Horizontal Timeline -->
  <line x1="120" y1="230" x2="840" y2="230" stroke="#b45309" stroke-width="4"/>
  
  <!-- Phase 1 -->
  <circle cx="200" cy="230" r="18" fill="#f59e0b"/>
  <text x="200" y="235" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">1</text>
  <rect x="100" y="270" width="200" height="150" rx="12" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="120" y="300" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 1: BETA</text>
  <text x="120" y="325" font-size="12" font-family="sans-serif" fill="#fde68a">• Tháng 09/2026</text>
  <text x="120" y="350" font-size="12" font-family="sans-serif" fill="#fef3c7">• Mời 100 Founders thử nghiệm sản phẩm sớm (Private Access).</text>
  <text x="120" y="390" font-size="12" font-family="sans-serif" fill="#fef3c7">• Thu thập feedback về luồng Clone &amp; tải PPTX.</text>
  
  <!-- Phase 2 -->
  <circle cx="480" cy="230" r="18" fill="#f59e0b"/>
  <text x="480" y="235" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">2</text>
  <rect x="380" y="270" width="200" height="150" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="300" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 2: LAUNCH</text>
  <text x="400" y="325" font-size="12" font-family="sans-serif" fill="#fde68a">• Tháng 11/2026</text>
  <text x="400" y="350" font-size="12" font-family="sans-serif" fill="#fef3c7">• Ra mắt chính thức trên Product Hunt &amp; Mạng xã hội.</text>
  <text x="400" y="390" font-size="12" font-family="sans-serif" fill="#fef3c7">• Bật gói Pro và thanh toán tự động.</text>
  
  <!-- Phase 3 -->
  <circle cx="760" cy="230" r="18" fill="#f59e0b"/>
  <text x="760" y="235" font-size="13" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">3</text>
  <rect x="660" y="270" width="200" height="150" rx="12" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="680" y="300" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff">GIAI ĐOẠN 3: SCALE</text>
  <text x="680" y="325" font-size="12" font-family="sans-serif" fill="#fde68a">• Quý 1/2027</text>
  <text x="680" y="350" font-size="12" font-family="sans-serif" fill="#fef3c7">• Mở rộng thị trường Singapore &amp; Indonesia.</text>
  <text x="680" y="390" font-size="12" font-family="sans-serif" fill="#fef3c7">• Phát hành tính năng cộng tác nhóm nhiều người cùng lúc.</text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#d97706" text-anchor="end">Slide 4 / 5</text>
</svg>

