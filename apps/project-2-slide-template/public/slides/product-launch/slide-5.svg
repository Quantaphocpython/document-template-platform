<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#451a03"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#f59e0b">04 / CHỈ SỐ THÀNH CÔNG (KPIS)</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Mục Tiêu Tăng Trưởng &amp; Hiệu Quả Đầu Tư (ROI)</text>
  
  <rect x="80" y="170" width="250" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <text x="105" y="215" font-size="12" font-family="sans-serif" font-weight="bold" fill="#fde68a">NGƯỜI DÙNG ĐĂNG KÝ</text>
  <text x="105" y="260" font-size="38" font-family="sans-serif" font-weight="900" fill="#ffffff">50,000+</text>
  <text x="105" y="300" font-size="12" font-family="sans-serif" fill="#fef3c7">
    <tspan x="105" dy="0">Đạt được trong vòng 90 ngày đầu</tspan>
    <tspan x="105" dy="20">kể từ khi mở cổng đăng ký.</tspan>
  </text>
  
  <rect x="355" y="170" width="250" height="260" rx="16" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="215" font-size="12" font-family="sans-serif" font-weight="bold" fill="#f59e0b">TỶ LỆ CHUYỂN ĐỔI (CVR)</text>
  <text x="380" y="260" font-size="38" font-family="sans-serif" font-weight="900" fill="#ffffff">6.8%</text>
  <text x="380" y="300" font-size="12" font-family="sans-serif" fill="#fef3c7">
    <tspan x="380" dy="0">Tỷ lệ từ người dùng bản mẫu</tspan>
    <tspan x="380" dy="20">miễn phí nâng cấp lên bản Pro.</tspan>
  </text>
  
  <rect x="630" y="170" width="250" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <text x="655" y="215" font-size="12" font-family="sans-serif" font-weight="bold" fill="#fde68a">HIỆU QUẢ QUẢNG CÁO</text>
  <text x="655" y="260" font-size="38" font-family="sans-serif" font-weight="900" fill="#ffffff">3.5x</text>
  <text x="655" y="300" font-size="12" font-family="sans-serif" fill="#fef3c7">
    <tspan x="655" dy="0">Mỗi 1 USD ngân sách tiếp thị</tspan>
    <tspan x="655" dy="20">tạo 3.5 USD doanh thu năm.</tspan>
  </text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#d97706" text-anchor="end">Slide 5 / 5</text>
</svg>
