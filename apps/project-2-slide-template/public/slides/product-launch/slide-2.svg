<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#451a03"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#f59e0b">01 / KHÁCH HÀNG MỤC TIÊU</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Chân Dung Khách Hàng (Personas) &amp; Định Vị</text>
  
  <rect x="80" y="170" width="380" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <rect x="110" y="200" width="120" height="24" rx="6" fill="#f59e0b"/>
  <text x="170" y="217" font-size="11" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">PERSONA A</text>
  <text x="110" y="255" font-size="19" font-family="sans-serif" font-weight="bold" fill="#ffffff">Lãnh Đạo Khởi Nghiệp (Founders)</text>
  <text x="110" y="290" font-size="12" font-family="sans-serif" fill="#fde68a">• Nhu cầu: Soạn thảo hợp đồng, pitch deck gọi vốn.</text>
  <text x="110" y="325" font-size="12" font-family="sans-serif" fill="#fde68a">
    <tspan x="110" dy="0">• Thách thức: Thiếu phòng pháp chế</tspan>
    <tspan x="110" dy="18">và đội ngũ thiết kế chuyên biệt.</tspan>
  </text>
  <text x="110" y="375" font-size="12" font-family="sans-serif" fill="#fde68a">
    <tspan x="110" dy="0">• Giá trị: Mẫu chuẩn hóa 100%,</tspan>
    <tspan x="110" dy="18">bảo vệ tuyệt đối tệp mẫu gốc.</tspan>
  </text>
  
  <rect x="500" y="170" width="380" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <rect x="530" y="200" width="120" height="24" rx="6" fill="#f59e0b"/>
  <text x="590" y="217" font-size="11" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">PERSONA B</text>
  <text x="530" y="255" font-size="19" font-family="sans-serif" font-weight="bold" fill="#ffffff">Khối Vận Hành (PMO / HR)</text>
  <text x="530" y="290" font-size="12" font-family="sans-serif" fill="#fde68a">• Nhu cầu: Quản lý hàng trăm biểu mẫu nội bộ.</text>
  <text x="530" y="325" font-size="12" font-family="sans-serif" fill="#fde68a">
    <tspan x="530" dy="0">• Thách thức: Nhân sự hay ghi đè</tspan>
    <tspan x="530" dy="18">làm thất thoát định dạng mẫu cũ.</tspan>
  </text>
  <text x="530" y="375" font-size="12" font-family="sans-serif" fill="#fde68a">
    <tspan x="530" dy="0">• Giá trị: Sao chép an toàn,</tspan>
    <tspan x="530" dy="18">xuất tệp DOCX / PPTX chuẩn OpenXML.</tspan>
  </text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#d97706" text-anchor="end">Slide 2 / 5</text>
</svg>
