<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#451a03"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#f59e0b">01 / KHÁCH HÀNG MỤC TIÊU</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Chân Dung Khách Hàng (Personas) &amp; Định Vị</text>
  
  <rect x="80" y="170" width="380" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <rect x="110" y="200" width="120" height="24" rx="6" fill="#f59e0b"/>
  <text x="170" y="217" font-size="11" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">PERSONA A</text>
  <text x="110" y="260" font-size="20" font-family="sans-serif" font-weight="bold" fill="#ffffff">Lãnh Đạo Khởi Nghiệp (Founders)</text>
  <text x="110" y="295" font-size="13" font-family="sans-serif" fill="#fde68a">• Nhu cầu: Soạn thảo hợp đồng, pitch deck gọi vốn nhanh.</text>
  <text x="110" y="325" font-size="13" font-family="sans-serif" fill="#fde68a">• Thách thức: Thiếu phòng pháp chế và đội thiết kế riêng.</text>
  <text x="110" y="355" font-size="13" font-family="sans-serif" fill="#fde68a">• Giá trị nhận: Mẫu chuẩn 100%, bảo vệ tuyệt đối file gốc.</text>
  
  <rect x="500" y="170" width="380" height="260" rx="16" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <rect x="530" y="200" width="120" height="24" rx="6" fill="#f59e0b"/>
  <text x="590" y="217" font-size="11" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">PERSONA B</text>
  <text x="530" y="260" font-size="20" font-family="sans-serif" font-weight="bold" fill="#ffffff">Khối Vận Hành Doanh Nghiệp (PMO/HR)</text>
  <text x="530" y="295" font-size="13" font-family="sans-serif" fill="#fde68a">• Nhu cầu: Quản lý hàng trăm biểu mẫu nội bộ tập trung.</text>
  <text x="530" y="325" font-size="13" font-family="sans-serif" fill="#fde68a">• Thách thức: Nhân viên thường xuyên ghi đè làm mất mẫu cũ.</text>
  <text x="530" y="355" font-size="13" font-family="sans-serif" fill="#fde68a">• Giá trị nhận: Cơ chế nhân bản an toàn, xuất DOCX/PPTX chuẩn.</text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#d97706" text-anchor="end">Slide 2 / 5</text>
</svg>

