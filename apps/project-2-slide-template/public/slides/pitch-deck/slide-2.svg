<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#6366f1">01 / VẤN ĐỀ &amp; GIẢI PHÁP</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Nỗi Đau Doanh Nghiệp &amp; Bước Đột Phá</text>
  
  <!-- Left Box: The Problem -->
  <rect x="80" y="160" width="380" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="110" y="190" width="90" height="26" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="155" y="208" font-size="12" font-family="sans-serif" font-weight="bold" fill="#f87171" text-anchor="middle">VẤN ĐỀ</text>
  <text x="110" y="248" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ffffff">35% Giờ Làm Việc Bị Lãng Phí</text>
  <text x="110" y="285" font-size="13" font-family="sans-serif" fill="#94a3b8">• Thiếu thư viện biểu mẫu chuẩn hóa.</text>
  <text x="110" y="318" font-size="13" font-family="sans-serif" fill="#94a3b8">• Sửa nhầm và làm sai lệch mẫu gốc.</text>
  <text x="110" y="351" font-size="13" font-family="sans-serif" fill="#94a3b8">• Không đồng bộ định dạng giữa các máy.</text>
  
  <!-- Right Box: The Solution -->
  <rect x="500" y="160" width="380" height="280" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <rect x="530" y="190" width="90" height="26" rx="6" fill="#6366f1" opacity="0.3"/>
  <text x="575" y="208" font-size="12" font-family="sans-serif" font-weight="bold" fill="#a5b4fc" text-anchor="middle">GIẢI PHÁP</text>
  <text x="530" y="248" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ffffff">Office Engine: Copy-on-Create</text>
  <text x="530" y="285" font-size="13" font-family="sans-serif" fill="#cbd5e1">✓ Thư viện 100+ mẫu tài liệu &amp; slide.</text>
  <text x="530" y="318" font-size="13" font-family="sans-serif" fill="#cbd5e1">✓ Sao chép độc lập 100%, bảo vệ mẫu gốc.</text>
  <text x="530" y="350" font-size="12" font-family="sans-serif" fill="#cbd5e1">
    <tspan x="530" dy="0">✓ Biên soạn trực quan trên web</tspan>
    <tspan x="530" dy="18">và xuất file chuẩn OpenXML.</tspan>
  </text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#64748b" text-anchor="end">Slide 2 / 5</text>
</svg>
