<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#022c22"/>
  
  <text x="80" y="80" font-size="14" font-family="sans-serif" font-weight="bold" fill="#34d399">03 / KHỐI CÔNG NGHỆ &amp; SẢN PHẨM</text>
  <text x="80" y="125" font-size="34" font-family="sans-serif" font-weight="800" fill="#ffffff">Tiến Độ R&amp;D &amp; Độ Ổn Định Hạ Tầng</text>
  
  <!-- 4 Feature Delivery Cards -->
  <rect x="80" y="165" width="380" height="120" rx="12" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <circle cx="115" cy="205" r="16" fill="#10b981"/>
  <text x="115" y="210" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="145" y="200" font-size="15" font-family="sans-serif" font-weight="bold" fill="#ffffff">Document Template Suite v2.0</text>
  <text x="145" y="224" font-size="12" font-family="sans-serif" fill="#6ee7b7">
    <tspan x="145" dy="0">Phát hành cơ chế sao chép độc lập</tspan>
    <tspan x="145" dy="18">bảo vệ 100% tệp mẫu gốc an toàn.</tspan>
  </text>
  
  <rect x="500" y="165" width="380" height="120" rx="12" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <circle cx="535" cy="205" r="16" fill="#10b981"/>
  <text x="535" y="210" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="565" y="200" font-size="15" font-family="sans-serif" font-weight="bold" fill="#ffffff">Presentation Deck Engine 16:9</text>
  <text x="565" y="224" font-size="12" font-family="sans-serif" fill="#6ee7b7">
    <tspan x="565" dy="0">Tích hợp xem trước Cinema HD</tspan>
    <tspan x="565" dy="18">và xuất file PPTX tương thích cao.</tspan>
  </text>
  
  <rect x="80" y="305" width="380" height="120" rx="12" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <circle cx="115" cy="345" r="16" fill="#10b981"/>
  <text x="115" y="350" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="145" y="340" font-size="15" font-family="sans-serif" font-weight="bold" fill="#ffffff">Hạ Tầng Uptime 99.99%</text>
  <text x="145" y="364" font-size="12" font-family="sans-serif" fill="#6ee7b7">
    <tspan x="145" dy="0">Vận hành xuyên suốt, không xảy ra</tspan>
    <tspan x="145" dy="18">bất kỳ sự cố gián đoạn dịch vụ nào.</tspan>
  </text>
  
  <rect x="500" y="305" width="380" height="120" rx="12" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <circle cx="535" cy="345" r="16" fill="#34d399"/>
  <text x="535" y="350" font-size="14" font-family="sans-serif" font-weight="bold" fill="#022c22" text-anchor="middle">⚡</text>
  <text x="565" y="340" font-size="15" font-family="sans-serif" font-weight="bold" fill="#ffffff">Tốc Độ Tải Dưới 300ms</text>
  <text x="565" y="364" font-size="12" font-family="sans-serif" fill="#6ee7b7">
    <tspan x="565" dy="0">Tối ưu hóa Server-Side Rendering</tspan>
    <tspan x="565" dy="18">kết hợp bộ nhớ cache đa lớp siêu tốc.</tspan>
  </text>
  
  <text x="880" y="490" font-size="12" font-family="sans-serif" fill="#059669" text-anchor="end">Slide 4 / 5</text>
