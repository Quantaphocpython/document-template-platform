  </text>
  
  <rect x="630" y="170" width="250" height="250" rx="16" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
  <text x="655" y="215" font-size="12" font-family="sans-serif" font-weight="bold" fill="#a7f3d0">TỶ LỆ GIỮ CHÂN NET (NRR)</text>
  <text x="655" y="260" font-size="38" font-family="sans-serif" font-weight="900" fill="#ffffff">124%</text>
  <text x="655" y="300" font-size="12" font-family="sans-serif" fill="#6ee7b7">
