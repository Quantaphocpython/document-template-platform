<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="reportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#f0f9ff"/>
  
  <g filter="url(#cardShadow)">
    <rect x="90" y="25" width="220" height="230" rx="6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
    
    <!-- Title -->
    <rect x="110" y="45" width="180" height="10" rx="2" fill="#0369a1"/>
    <rect x="110" y="60" width="120" height="4" rx="2" fill="#38bdf8"/>
    
    <!-- KPI Cards mini -->
    <rect x="110" y="75" width="85" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="118" y="90" font-size="7" font-family="sans-serif" fill="#64748b">HOÀN THÀNH</text>
    <text x="118" y="106" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0284c7">92%</text>
    
    <rect x="205" y="75" width="85" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="213" y="90" font-size="7" font-family="sans-serif" fill="#64748b">TRẠNG THÁI</text>
    <text x="213" y="106" font-size="10" font-family="sans-serif" font-weight="bold" fill="#16a34a">TỐT</text>
    
    <!-- Mini Bar Chart -->
    <rect x="110" y="130" width="180" height="75" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="125" y="170" width="18" height="25" rx="2" fill="#93c5fd"/>
    <rect x="155" y="155" width="18" height="40" rx="2" fill="#60a5fa"/>
    <rect x="185" y="145" width="18" height="50" rx="2" fill="#3b82f6"/>
    <rect x="215" y="140" width="18" height="55" rx="2" fill="#2563eb"/>
    <rect x="245" y="135" width="18" height="60" rx="2" fill="#1d4ed8"/>
    
    <!-- Baseline -->
    <line x1="120" y1="195" x2="275" y2="195" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
</svg>

