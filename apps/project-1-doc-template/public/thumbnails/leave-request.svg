<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="leaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#f0fdf4"/>
  
  <g filter="url(#cardShadow)">
    <rect x="90" y="25" width="220" height="230" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="140" y="42" width="120" height="6" rx="3" fill="#10b981"/>
    <rect x="120" y="65" width="160" height="10" rx="3" fill="#065f46"/>
    
    <!-- Form fields -->
    <rect x="110" y="90" width="60" height="6" rx="2" fill="#94a3b8"/>
    <rect x="180" y="90" width="110" height="6" rx="2" fill="#cbd5e1"/>
    
    <rect x="110" y="105" width="50" height="6" rx="2" fill="#94a3b8"/>
    <rect x="170" y="105" width="120" height="6" rx="2" fill="#cbd5e1"/>
    
    <!-- Mini Table -->
    <rect x="110" y="125" width="180" height="60" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="110" y1="145" x2="290" y2="145" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="110" y1="165" x2="290" y2="165" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="170" y1="125" x2="170" y2="185" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="230" y1="125" x2="230" y2="185" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Approved Stamp -->
    <rect x="210" y="200" width="70" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="245" y="216" font-size="9" font-family="sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle">DUYỆT</text>
  </g>
</svg>

