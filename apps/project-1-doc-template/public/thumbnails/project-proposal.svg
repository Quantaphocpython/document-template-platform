<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="proposalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#fffbeb"/>
  
  <g filter="url(#cardShadow)">
    <rect x="90" y="25" width="220" height="230" rx="6" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5"/>
    
    <!-- Title -->
    <rect x="110" y="45" width="180" height="12" rx="3" fill="#b45309"/>
    <rect x="130" y="63" width="140" height="5" rx="2" fill="#f59e0b"/>
    
    <!-- Decorative geometric banner -->
    <path d="M 110,80 L 290,80 L 275,95 L 110,95 Z" fill="#fef3c7"/>
    <text x="120" y="91" font-size="8" font-family="sans-serif" font-weight="bold" fill="#92400e">BUSINESS CASE 2026</text>
    
    <!-- Paragraph lines -->
    <rect x="110" y="110" width="180" height="4" rx="2" fill="#94a3b8"/>
    <rect x="110" y="122" width="165" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="110" y="134" width="175" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Investment Box -->
    <rect x="110" y="150" width="180" height="50" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="120" y="168" font-size="8" font-family="sans-serif" fill="#78350f">DỰ TOÁN NGÂN SÁCH:</text>
    <text x="120" y="188" font-size="13" font-family="sans-serif" font-weight="bold" fill="#b45309">250.000.000 đ</text>
    
    <circle cx="265" cy="175" r="14" fill="#f59e0b"/>
    <text x="265" y="180" font-size="14" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  </g>
</svg>

