<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="meetingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#faf5ff"/>
  
  <g filter="url(#cardShadow)">
    <rect x="90" y="25" width="220" height="230" rx="6" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5"/>
    
    <!-- Title -->
    <rect x="110" y="45" width="180" height="12" rx="3" fill="#6b21a8"/>
    <rect x="140" y="63" width="120" height="5" rx="2" fill="#a855f7"/>
    
    <!-- Bullet points -->
    <circle cx="115" cy="85" r="3" fill="#9333ea"/>
    <rect x="125" y="83" width="150" height="4" rx="2" fill="#64748b"/>
    <circle cx="115" cy="98" r="3" fill="#9333ea"/>
    <rect x="125" y="96" width="130" height="4" rx="2" fill="#64748b"/>
    <circle cx="115" cy="111" r="3" fill="#9333ea"/>
    <rect x="125" y="109" width="160" height="4" rx="2" fill="#64748b"/>
    
    <!-- Action Item Grid -->
    <rect x="110" y="130" width="180" height="70" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <rect x="110" y="130" width="180" height="18" rx="3" fill="#ede9fe"/>
    <text x="120" y="143" font-size="8" font-family="sans-serif" font-weight="bold" fill="#6d28d9">ACTION ITEMS</text>
    
    <circle cx="120" cy="160" r="4" fill="#10b981"/>
    <rect x="132" y="158" width="100" height="4" rx="2" fill="#475569"/>
    <rect x="245" y="156" width="35" height="8" rx="4" fill="#dcfce7"/>
    
    <circle cx="120" cy="180" r="4" fill="#f59e0b"/>
    <rect x="132" y="178" width="80" height="4" rx="2" fill="#475569"/>
    <rect x="245" y="176" width="35" height="8" rx="4" fill="#fef3c7"/>
  </g>
</svg>

