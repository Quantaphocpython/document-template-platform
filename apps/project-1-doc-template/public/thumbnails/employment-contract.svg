<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="contractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  
  <!-- Mini A4 Paper -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="25" width="220" height="230" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Top badge ribbon -->
    <rect x="130" y="42" width="140" height="8" rx="4" fill="url(#contractGrad)"/>
    <rect x="150" y="56" width="100" height="4" rx="2" fill="#94a3b8"/>
    
    <!-- Title -->
    <rect x="115" y="75" width="170" height="10" rx="3" fill="#1e293b"/>
    
    <!-- Text lines -->
    <rect x="110" y="100" width="180" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="110" y="112" width="160" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="110" y="124" width="175" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Section Header -->
    <rect x="110" y="142" width="100" height="6" rx="2" fill="#3b82f6"/>
    <rect x="110" y="156" width="170" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="110" y="166" width="150" height="4" rx="2" fill="#e2e8f0"/>
    
    <!-- Signature block with stamp -->
    <circle cx="250" cy="210" r="18" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="250" y="213" font-size="8" font-family="sans-serif" font-weight="bold" fill="#dc2626" text-anchor="middle">ĐÃ KÝ</text>
    <line x1="125" y1="215" x2="175" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>

